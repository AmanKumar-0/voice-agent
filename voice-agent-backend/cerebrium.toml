[cerebrium.deployment]
name = "voice-agent"
python_version = "3.11"
docker_base_image_url = "debian:bookworm-slim"
disable_auth = false
# Custom Dockerfile runs the LiveKit agent (python run.py dev) instead of default Uvicorn + main
dockerfile_path = "Dockerfile"
# Project root = voice-agent-backend: include everything here so main.py and agent code are in the bundle
include = ['./**', 'cerebrium.toml']
exclude = ['.*']

[cerebrium.hardware]
cpu = 2
memory = 8.0
compute = "CPU"

[cerebrium.scaling]
min_replicas = 1
max_replicas = 5
cooldown = 30
replica_concurrency = 1
response_grace_period = 900
scaling_metric = "cpu_utilization"
scaling_target = 60

[cerebrium.runtime.custom]
port = 8081
dockerfile_path = "./Dockerfile"
# Start command is set in Dockerfile CMD; main.py still required for Cerebrium's __import__("main")